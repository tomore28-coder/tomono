<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デザイン添削&amp;アドバイスツール</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --surface2: #f2f1ee;
    --border: #e0ddd6;
    --text: #1a1a18;
    --text2: #6b6960;
    --text3: #a09d96;
    --accent: #1a1a18;
    --green: #3B6D11; --green-bg: #EAF3DE;
    --amber: #854F0B; --amber-bg: #FAEEDA;
    --red: #A32D2D;   --red-bg: #FCEBEB;
    --blue: #185FA5;
    --radius: 10px;
    --radius-lg: 14px;
  }
  body { font-family: -apple-system, 'Helvetica Neue', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .page { max-width: 640px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: var(--text2); margin-bottom: 1.25rem; }

  .encourage-box {
    background: linear-gradient(135deg, #FFF8E7, #F0F7E6);
    border: 1px solid #E8E0C8;
    border-radius: var(--radius-lg);
    padding: 1.1rem 1.3rem;
    margin-bottom: 1.5rem;
  }
  .encourage-box p { font-size: 13.5px; line-height: 1.85; color: #5B6B45; margin: 0; }
  .encourage-box p + p { margin-top: 8px; }
  .encourage-box .eb-highlight { font-weight: 700; color: #5E7F34; }

  .upload-zone {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius-lg);
    padding: 2.5rem 1.5rem;
    text-align: center;
    cursor: pointer;
    background: var(--surface);
    transition: border-color .15s, background .15s;
    margin-bottom: 1rem;
  }
  .upload-zone:hover, .upload-zone.drag { border-color: #888; background: var(--surface2); }
  .upload-zone svg { display: block; margin: 0 auto 10px; color: var(--text3); }
  .upload-zone p { font-size: 15px; color: var(--text2); }
  .upload-zone span { font-size: 13px; color: var(--text3); margin-top: 4px; display: block; }
  #file-input { display: none; }

  #preview-area { display: none; margin-bottom: 1rem; }
  #preview-img { width: 100%; max-height: 280px; object-fit: contain; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
  label { font-size: 13px; color: var(--text2); display: block; margin-bottom: 4px; }
  select, input[type="text"] {
    width: 100%; font-size: 14px; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: var(--text);
    outline: none; transition: border-color .15s;
  }
  select:focus, input:focus { border-color: #888; }

  .btn-primary {
    width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
    border-radius: var(--radius); cursor: pointer;
    border: none; background: var(--accent); color: #fff;
    margin-bottom: 1.5rem; transition: opacity .15s;
  }
  .btn-primary:hover { opacity: .85; }
  .btn-primary:disabled { opacity: .35; cursor: not-allowed; }

  .error { background: var(--red-bg); color: var(--red); padding: 12px 14px; border-radius: var(--radius); font-size: 14px; margin-bottom: 1rem; display: none; }

  /* Loading */
  .loading { text-align: center; padding: 3rem 0; display: none; }
  .spinner { width: 36px; height: 36px; border: 2.5px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
  .loading p { font-size: 14px; color: var(--text2); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results */
  #score-content { display: none; }

  .result-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 1.5rem 1.5rem;
    margin-bottom: 1.5rem;
    font-size: 14.5px; line-height: 1.85; color: var(--text);
    overflow-wrap: break-word;
  }
  .result-card .md-h1 { font-size: 19px; font-weight: 700; margin: 0 0 12px; }
  .result-card .md-h2 {
    font-size: 15px; font-weight: 700; margin: 26px 0 10px;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .result-card .md-h2:first-child { margin-top: 0; }
  .result-card .md-item { font-weight: 600; margin: 16px 0 4px; }
  .result-card .md-quote {
    display: block; margin: 4px 0 4px 2px; padding: 8px 12px;
    background: var(--surface2); border-left: 3px solid var(--border);
    border-radius: 4px; font-size: 13.5px; color: var(--text2);
  }
  .result-card .md-list { margin: 2px 0 2px 1.2em; }
  .result-card strong { font-weight: 700; }
  .result-card p { margin: 2px 0; }

  .btn-retry { font-size: 14px; padding: 9px 20px; border-radius: var(--radius); cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .btn-retry:hover { background: var(--surface2); }

  @media (max-width: 480px) {
    .row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="page">
  <h1>デザイン添削&amp;アドバイスツール</h1>
  <p class="subtitle">バナー・LP・印刷物などの画像をアップロードすると、AIが「デザイン基礎」「売れるデザイン」の2視点で採点し、問いかけ形式でアドバイスします</p>

  <div class="encourage-box">
    <p>これは、あなたのデザインの精度を上げるための壁打ちツールです。依頼者に素案を出す前に一度ここに通して、自分のデザインを見返してみましょう。気づいたことを1つ取り入れるだけで、デザインは確実に良くなります。</p>
    <p class="eb-highlight">🌱 採点は"ダメ出し"ではなく"伸びしろ探し"。今日も1歩前進!</p>
  </div>

  <div class="upload-zone" id="upload-zone">
    <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 16V8m0 0-3 3m3-3 3 3M4 16v1a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1"/></svg>
    <p>画像をここにドロップ、またはクリックして選択</p>
    <span>PNG / JPG / WEBP 対応</span>
    <input type="file" id="file-input" accept="image/*">
  </div>

  <div id="preview-area">
    <img id="preview-img" alt="アップロードされたデザイン">
  </div>

  <div class="row">
    <div>
      <label for="type-select">制作物の種類</label>
      <select id="type-select">
        <option>バナー広告（楽天・Yahoo）</option>
        <option>バナー</option>
        <option>LP（商品ページ全体）</option>
        <option>LP上部ファーストビュー</option>
        <option>LP説明コンテンツ（FV以外の説得コンテンツ）</option>
        <option>商品サムネイル</option>
        <option>Amazon商品画像</option>
        <option>印刷物（説明書・パッケージ・チラシ）</option>
      </select>
    </div>
    <div>
      <label for="context-input">ターゲット・商品情報（任意）</label>
      <input type="text" id="context-input" placeholder="例：30代女性向けサウナグッズ">
    </div>
  </div>

  <div id="error-msg" class="error"></div>

  <button class="btn-primary" id="submit-btn" disabled>AIで採点する</button>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>AIがデザインを分析中...</p>
  </div>

  <div id="score-content">
    <div class="result-card" id="result-card"></div>
    <button class="btn-retry" onclick="reset()">別の画像を採点する</button>
  </div>
</div>

<script>
let imageBase64 = null, imageType = 'image/jpeg';

const uploadZone = document.getElementById('upload-zone');
const fileInput  = document.getElementById('file-input');
const previewArea = document.getElementById('preview-area');
const previewImg  = document.getElementById('preview-img');
const submitBtn   = document.getElementById('submit-btn');
const loading     = document.getElementById('loading');
const scoreContent = document.getElementById('score-content');
const errorMsg    = document.getElementById('error-msg');

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.classList.remove('drag');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

function loadFile(file) {
  imageType = file.type || 'image/jpeg';
  const reader = new FileReader();
  reader.onload = e => {
    imageBase64 = e.target.result.split(',')[1];
    previewImg.src = e.target.result;
    previewArea.style.display = 'block';
    submitBtn.disabled = false;
    scoreContent.style.display = 'none';
    errorMsg.style.display = 'none';
  };
  reader.readAsDataURL(file);
}

submitBtn.addEventListener('click', analyze);

async function analyze() {
  if (!imageBase64) return;
  submitBtn.disabled = true;
  loading.style.display = 'block';
  scoreContent.style.display = 'none';
  errorMsg.style.display = 'none';

  try {
    const res = await fetch('/api/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        imageBase64, imageType,
        designType: document.getElementById('type-select').value,
        context: document.getElementById('context-input').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'エラーが発生しました');
    renderResult(data);
  } catch(err) {
    errorMsg.textContent = 'エラー: ' + err.message;
    errorMsg.style.display = 'block';
    submitBtn.disabled = false;
  } finally {
    loading.style.display = 'none';
  }
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function inlineMd(s) {
  return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

// Minimal markdown → HTML for the score report (headings, bold, quotes, lists).
// No collapsible UI — everything renders as plain readable text/blocks.
function markdownToHtml(md) {
  return md.split('\n').map(raw => {
    const line = escapeHtml(raw);
    if (/^# /.test(raw)) return `<div class="md-h1">${inlineMd(line.slice(2))}</div>`;
    if (/^## /.test(raw)) return `<div class="md-h2">${inlineMd(line.slice(3))}</div>`;
    if (/^\*\*.+\*\*$/.test(raw.trim())) return `<div class="md-item">${inlineMd(line.trim())}</div>`;
    if (/^>\s?/.test(raw)) return `<span class="md-quote">${inlineMd(line.replace(/^&gt;\s?/, ''))}</span>`;
    if (/^(\d+\.|[-□])\s?/.test(raw.trim())) return `<div class="md-list">${inlineMd(line)}</div>`;
    if (raw.trim() === '') return '';
    return `<p>${inlineMd(line)}</p>`;
  }).join('');
}

function renderResult(r) {
  scoreContent.style.display = 'block';
  document.getElementById('result-card').innerHTML = markdownToHtml(r.markdown || '');
}

function reset() {
  imageBase64 = null; fileInput.value = '';
  previewArea.style.display = 'none'; previewImg.src = '';
  scoreContent.style.display = 'none';
  errorMsg.style.display = 'none';
  submitBtn.disabled = true;
  document.getElementById('context-input').value = '';
}
</script>
</body>
</html>
